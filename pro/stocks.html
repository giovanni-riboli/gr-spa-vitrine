<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stocks — Espace Pro Giovanni Riboli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0f1e2c;min-height:100vh;display:flex}
    .sidebar{width:250px;background:#1a2d3e;color:#fff;min-height:100vh;position:fixed;left:0;top:0;z-index:100;transition:transform .3s}
    .sidebar .logo-area{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
    .sidebar .logo-area img{height:32px}
    .sidebar .logo-area .brand{font-size:14px;font-weight:600;color:#c7a260;margin-top:6px}
    .sidebar nav{padding:16px 0}
    .sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 24px;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s}
    .sidebar nav a:hover,.sidebar nav a.active{color:#c7a260;background:rgba(199,162,96,.08)}
    .sidebar nav a.active{border-right:3px solid #c7a260}
    .sidebar nav a svg{width:18px;height:18px;flex-shrink:0}
    .main{margin-left:250px;flex:1;min-height:100vh}
    .header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .header .title{font-size:16px;font-weight:600;color:#253a4c}
    .header .user-area{display:flex;align-items:center;gap:16px;font-size:13px;color:#7a8a9a}
    .header .user-area strong{color:#253a4c}
    .btn-logout{padding:8px 16px;background:none;border:1px solid #dce1e8;border-radius:6px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;color:#253a4c;transition:all .2s}
    .btn-logout:hover{border-color:#c7a260;color:#c7a260}
    .content{padding:32px}
    .hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px}
    .hamburger svg{width:24px;height:24px;color:#253a4c}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90}
    .page-title{font-size:22px;font-weight:600;color:#253a4c;margin-bottom:8px}
    .page-subtitle{font-size:13px;color:#7a8a9a;margin-bottom:24px}
    /* Table */
    .table-wrap{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    thead{background:#253a4c;color:#fff}
    th{padding:14px 18px;text-align:left;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.3px}
    td{padding:14px 18px;border-bottom:1px solid #f0f0f0}
    tbody tr:nth-child(even){background:#fafbfc}
    tbody tr:hover{background:#f5f0e6}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
    .badge-stock{background:#ecfdf5;color:#059669}
    .badge-low{background:#fef3c7;color:#b45309}
    .badge-out{background:#fef2f2;color:#b91c1c}
    .btn-order{padding:6px 14px;background:#c7a260;color:#fff;border:none;border-radius:6px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:background .2s}
    .btn-order:hover{background:#b08d4a}
    .note{margin-top:16px;padding:14px 18px;background:#fff;border-radius:8px;border-left:3px solid #c7a260;font-size:13px;color:#7a8a9a}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.overlay.open{display:block}
      .main{margin-left:0}.hamburger{display:block}.content{padding:20px}
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <img src="../assets/logo-blanc.svg" alt="GR" onerror="this.style.display='none'">
      <div class="brand">Espace Revendeur</div>
    </div>
    <nav>
      <a href='dashboard.html'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Tableau de bord</a>
      <a href='documents.html'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Documents</a>
      <a class='active' href='stocks.html'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Stocks</a>
      <a href='profil.html'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Mon profil</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <span class="title">Stocks</span>
      </div>
      <div class="user-area">
        <span>Connecté : <strong id="userName"></strong></span>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </header>

    <div class="content">
      <h1 class="page-title">Consultation des stocks</h1>
      <p class="page-subtitle">Disponibilité des modèles Giovanni Riboli</p>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Modèle</th><th>Gamme</th><th>Disponibilité</th><th>Délai livraison</th><th></th></tr></thead>
          <tbody id="stocksBody"></tbody>
        </table>
      </div>

      <div class="note">Les stocks sont mis à jour chaque semaine. Pour toute commande urgente, contactez votre gestionnaire.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      document.getElementById('userName').textContent = user.nom;

      // Mock stocks data (no stocks table in Supabase yet)
      const stocks = [
        {model:'Relax 4',gamme:'Relax',status:'stock',label:'En stock',delay:'2-3 semaines'},
        {model:'Relax 6',gamme:'Relax',status:'stock',label:'En stock',delay:'2-3 semaines'},
        {model:'Energy 5',gamme:'Energy',status:'low',label:'Stock faible',delay:'4-6 semaines'},
        {model:'Energy 7',gamme:'Energy',status:'stock',label:'En stock',delay:'2-3 semaines'},
        {model:'Luxury 6',gamme:'Luxury',status:'out',label:'Rupture',delay:'8-10 semaines'},
        {model:'Swim 400',gamme:'Swim',status:'stock',label:'En stock',delay:'3-4 semaines'},
      ];
      const icons = {stock:'✅',low:'⚠️',out:'❌'};
      const cls = {stock:'badge-stock',low:'badge-low',out:'badge-out'};
      document.getElementById('stocksBody').innerHTML = stocks.map(s => `
        <tr>
          <td><strong>${s.model}</strong></td>
          <td>${s.gamme}</td>
          <td><span class="badge ${cls[s.status]}">${icons[s.status]} ${s.label}</span></td>
          <td>${s.delay}</td>
          <td><a href="mailto:gestionnaire@giovanniriboli.com?subject=Commande ${s.model}&body=Bonjour, je souhaite commander le modèle ${s.model} (${s.gamme}).%0AMagasin : ${user.nom}" class="btn-order">Commander</a></td>
        </tr>
      `).join('');
    })();
  </script>
</body>
</html>
