<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil — Espace Pro Giovanni Riboli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1a2d3e; --bg-card: #253a4c; --accent: #c7a260;
      --text-light: #ccd8e0; --text-muted: #8aafc8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { overflow-x:hidden; max-width:100%; }
    body { font-family:'Inter',sans-serif; background:#0f1e2c; color:var(--text-light); min-height:100vh; display:flex; }

    /* Sidebar */
    .sidebar { width:250px; background:var(--bg-dark); min-height:100vh; position:fixed; left:0; top:0; z-index:100; transition:transform .3s; border-right:1px solid rgba(255,255,255,.06); }
    .sidebar .logo-area { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,.06); }
    .sidebar .logo-area img { height:32px; filter:brightness(0) invert(1); }
    .sidebar .logo-area .brand { font-size:13px; font-weight:600; color:var(--accent); margin-top:6px; letter-spacing:.5px; }
    .sidebar nav { padding:16px 0; }
    .sidebar nav a { display:flex; align-items:center; gap:10px; padding:12px 24px; color:rgba(255,255,255,.5); text-decoration:none; font-size:13px; font-weight:500; transition:all .2s; border-left:3px solid transparent; }
    .sidebar nav a:hover, .sidebar nav a.active { color:var(--accent); background:rgba(199,162,96,.06); border-left-color:var(--accent); }
    .sidebar nav a svg { width:18px; height:18px; flex-shrink:0; }

    /* Main */
    .main { margin-left:250px; flex:1; min-height:100vh; width:calc(100% - 250px); }
    .header { background:var(--bg-dark); border-bottom:1px solid rgba(255,255,255,.06); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .header .title { font-size:15px; font-weight:600; color:#fff; }
    .header .user-area { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
    .header .user-area strong { color:#fff; }
    .role-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
    .role-badge.admin { background:rgba(199,162,96,.15); color:var(--accent); }
    .role-badge.responsable { background:rgba(59,130,246,.15); color:#60a5fa; }
    .role-badge.revendeur { background:rgba(16,185,129,.15); color:#34d399; }
    .btn-logout { padding:8px 16px; background:none; border:1px solid rgba(255,255,255,.12); border-radius:6px; font-size:12px; font-family:'Inter',sans-serif; cursor:pointer; color:var(--text-muted); transition:all .2s; min-height:44px; }
    .btn-logout:hover { border-color:var(--accent); color:var(--accent); }

    .content { padding:32px; max-width:800px; }

    /* Cards */
    .card { background:var(--bg-card); border-radius:12px; padding:28px; border:1px solid rgba(255,255,255,.04); margin-bottom:24px; }
    .card-title { font-size:16px; font-weight:600; color:#fff; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .card-title svg { width:20px; height:20px; color:var(--accent); }

    /* Profile header */
    .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
    .avatar { width:64px; height:64px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:var(--bg-dark); flex-shrink:0; }
    .profile-name { font-size:20px; font-weight:600; color:#fff; }
    .profile-email { font-size:13px; color:var(--text-muted); margin-top:2px; }

    /* Info grid */
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .info-item { padding:12px; background:rgba(0,0,0,.15); border-radius:8px; }
    .info-label { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:4px; }
    .info-value { font-size:14px; color:#fff; font-weight:500; }
    .info-item.full { grid-column:1/-1; }

    /* Badges */
    .badge-role { display:inline-block; padding:4px 12px; border-radius:6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
    .badge-role.admin { background:#c7a260; color:#1a2d3e; }
    .badge-role.responsable { background:#3b82f6; color:#fff; }
    .badge-role.revendeur { background:#10b981; color:#fff; }

    .dept-tag { display:inline-block; padding:3px 10px; border-radius:4px; font-size:12px; font-weight:500; background:rgba(199,162,96,.12); color:var(--accent); margin:2px 4px 2px 0; }

    /* Form */
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12px; font-weight:500; color:var(--text-muted); margin-bottom:6px; }
    .form-group input { width:100%; padding:12px 14px; min-height:44px; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:#fff; font-size:14px; font-family:'Inter',sans-serif; transition:border-color .2s; }
    .form-group input:focus { outline:none; border-color:var(--accent); }
    .btn-primary { padding:12px 24px; min-height:44px; background:var(--accent); color:var(--bg-dark); border:none; border-radius:8px; font-size:14px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; transition:opacity .2s; }
    .btn-primary:hover { opacity:.9; }
    .btn-primary:disabled { opacity:.5; cursor:default; }

    /* Messages */
    .msg { padding:12px 16px; border-radius:8px; font-size:13px; font-weight:500; margin-bottom:16px; display:none; }
    .msg.success { display:block; background:rgba(16,185,129,.12); color:#34d399; border:1px solid rgba(16,185,129,.2); }
    .msg.error { display:block; background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.2); }

    /* Stats */
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:20px; }
    .stat-card { text-align:center; padding:16px; background:rgba(0,0,0,.15); border-radius:8px; }
    .stat-value { font-size:28px; font-weight:700; color:#fff; }
    .stat-label { font-size:11px; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.3px; }
    .btn-secondary { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; min-height:44px; background:none; border:1px solid var(--accent); color:var(--accent); border-radius:8px; font-size:13px; font-weight:500; font-family:'Inter',sans-serif; cursor:pointer; text-decoration:none; transition:all .2s; }
    .btn-secondary:hover { background:rgba(199,162,96,.1); }

    /* Loading */
    .loading { text-align:center; padding:60px; color:var(--text-muted); }
    .loading .spinner { width:32px; height:32px; border:3px solid rgba(199,162,96,.2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Hamburger */
    .hamburger { display:none; background:none; border:none; cursor:pointer; padding:8px; }
    .hamburger svg { width:24px; height:24px; color:#fff; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:90; }

    @media(max-width:768px) {
      .sidebar { transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); }
      .overlay.open { display:block; }
      .main { margin-left:0; width:100%; }
      .content { padding:20px; }
      .header { padding:12px 16px; }
      .hamburger { display:block; }
      .info-grid { grid-template-columns:1fr; }
      .stats-grid { grid-template-columns:1fr; }
      .profile-header { flex-direction:column; text-align:center; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <img src="../assets/logo-blanc.svg" alt="GR" onerror="this.style.display='none'">
      <div class="brand">Espace Revendeur</div>
    </div>
    <nav>
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="leads.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Leads
      </a>
      <a href="offres.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Offres en cours
      </a>
      <a href="documents.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Documents
      </a>
      <a href="stocks.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Stocks
      </a>
      <a class="admin-only" href="comptes.html" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>Comptes</a>
      <a class="active" href="profil.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Mon profil
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <span class="title">Mon Profil</span>
      </div>
      <div class="user-area">
        <span id="headerUserName"></span>
        <span class="role-badge" id="headerUserRole"></span>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </header>

    <div class="content">
      <div class="loading" id="loadingState">
        <div class="spinner"></div>
        <div>Chargement...</div>
      </div>

      <div id="mainContent" style="display:none">

        <!-- Section 1: Informations du compte -->
        <div class="card">
          <div class="profile-header">
            <div class="avatar" id="profileAvatar"></div>
            <div>
              <div class="profile-name" id="profileName"></div>
              <div class="profile-email" id="profileEmail"></div>
            </div>
          </div>
          <div class="info-grid">
            <div class="info-item">
              <div class="info-label">Rôle</div>
              <div class="info-value"><span class="badge-role" id="profileRole"></span></div>
            </div>
            <div class="info-item">
              <div class="info-label">Magasin / Région</div>
              <div class="info-value" id="profileMagasin">—</div>
            </div>
            <div class="info-item full" id="deptsRow" style="display:none">
              <div class="info-label">Départements couverts</div>
              <div class="info-value" id="profileDepts"></div>
            </div>
            <div class="info-item">
              <div class="info-label">Compte créé le</div>
              <div class="info-value" id="profileCreated"></div>
            </div>
          </div>
        </div>

        <!-- Section 2: Changer le mot de passe -->
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Changer le mot de passe
          </div>
          <div class="msg" id="pwMsg"></div>
          <form id="passwordForm" onsubmit="updatePassword(event)">
            <div class="form-group">
              <label for="newPassword">Nouveau mot de passe</label>
              <input type="password" id="newPassword" placeholder="Minimum 8 caractères" minlength="8" required>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirmer le mot de passe</label>
              <input type="password" id="confirmPassword" placeholder="Retapez le mot de passe" required>
            </div>
            <button type="submit" class="btn-primary" id="btnUpdatePw">Mettre à jour</button>
          </form>
        </div>

        <!-- Section 3: Statistiques personnelles (non-admin) -->
        <div class="card" id="statsSection" style="display:none">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
            Mes statistiques
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="statReceived">—</div>
              <div class="stat-label">Leads reçus ce mois</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="statContacted">—</div>
              <div class="stat-label">Leads contactés</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="statConversion">—</div>
              <div class="stat-label">Taux de conversion</div>
            </div>
          </div>
          <a href="leads.html" class="btn-secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Voir mes leads
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="notifications.js"></script>
  <script>
    const sb = initSupabase();

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.split(/[\s-]+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    }

    async function loadProfile() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '../espace-pro.html'; return; }

      const user = session.user;
      const meta = user.user_metadata || {};
      const fullName = meta.full_name || meta.nom || user.email;
      const role = meta.role || 'revendeur';

      // Header
      document.getElementById('headerUserName').innerHTML = '<strong>' + fullName + '</strong>';
      const roleBadge = document.getElementById('headerUserRole');
      roleBadge.textContent = role;
      roleBadge.className = 'role-badge ' + role;
      if (role === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');

      // Avatar
      document.getElementById('profileAvatar').textContent = getInitials(fullName);

      // Info
      document.getElementById('profileName').textContent = fullName;
      document.getElementById('profileEmail').textContent = user.email;

      const profileRoleBadge = document.getElementById('profileRole');
      profileRoleBadge.textContent = role;
      profileRoleBadge.className = 'badge-role ' + role;

      // Magasin
      const magasin = [meta.magasin_nom, meta.magasin_ville].filter(Boolean).join(' — ');
      document.getElementById('profileMagasin').textContent = magasin || '—';

      // Départements
      if (meta.departements && meta.departements.length) {
        document.getElementById('deptsRow').style.display = '';
        document.getElementById('profileDepts').innerHTML = meta.departements.map(d => '<span class="dept-tag">' + d + '</span>').join('');
      }

      // Date création
      document.getElementById('profileCreated').textContent = formatDate(user.created_at);

      // Stats si non-admin
      if (role !== 'admin') {
        document.getElementById('statsSection').style.display = '';
        await loadPersonalStats(session, meta);
      }

      // Show content
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('mainContent').style.display = '';
    }

    async function loadPersonalStats(session, meta) {
      try {
        const now = new Date();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();

        let query = sb.from('leads').select('*').gte('created_at', startOfMonth);

        // Filter by departments if applicable
        if (meta.departements && meta.departements.length) {
          const orFilters = meta.departements.map(d => 'code_postal.like.' + d + '%').join(',');
          query = query.or(orFilters);
        }

        const { data: leads } = await query;
        const all = leads || [];
        const contacted = all.filter(l => l.statut && l.statut !== 'nouveau' && l.statut !== 'non_contacte');
        const won = all.filter(l => l.statut === 'gagne');
        const convRate = all.length > 0 ? Math.round((won.length / all.length) * 100) : 0;

        document.getElementById('statReceived').textContent = all.length;
        document.getElementById('statContacted').textContent = contacted.length;
        document.getElementById('statConversion').textContent = convRate + '%';
      } catch (e) {
        console.error('Stats error:', e);
      }
    }

    async function updatePassword(e) {
      e.preventDefault();
      const msgEl = document.getElementById('pwMsg');
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      msgEl.className = 'msg';
      msgEl.style.display = 'none';

      if (newPass !== confirmPass) {
        msgEl.textContent = 'Les mots de passe ne correspondent pas';
        msgEl.className = 'msg error';
        return;
      }
      if (newPass.length < 8) {
        msgEl.textContent = 'Le mot de passe doit contenir au moins 8 caractères';
        msgEl.className = 'msg error';
        return;
      }

      document.getElementById('btnUpdatePw').disabled = true;
      const { error } = await sb.auth.updateUser({ password: newPass });

      if (error) {
        msgEl.textContent = error.message;
        msgEl.className = 'msg error';
      } else {
        msgEl.textContent = 'Mot de passe mis à jour avec succès ✓';
        msgEl.className = 'msg success';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      }
      document.getElementById('btnUpdatePw').disabled = false;
    }

    loadProfile();
  </script>
</body>
</html>
