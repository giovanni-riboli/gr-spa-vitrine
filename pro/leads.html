<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads — Espace Pro Giovanni Riboli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pro/pro.css">
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo-area">
      <img src="../assets/logo-blanc.svg" alt="GR" onerror="this.style.display='none'">
      <div class="brand">Espace Revendeur</div>
    </div>
    <nav>
      <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a class="active" href="leads.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Leads <span class="notif-badge" id="leadsCount" style="display:none;background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:auto;">0</span></a>
      <a href="offres.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Offres en cours</a>
      <a href="documents.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Documents</a>
      <a href="stocks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Stocks</a>
      <a class="admin-only" href="comptes.html" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>Comptes</a>
      <a href="profil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Mon profil</a>
    </nav>
  </aside>

  <div class="main">
    <header class="header">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <span id="realtimeStatus" title="Temps réel" style="width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block;margin-right:4px;"></span>
        <span class="title" id="pageTitle">Mes Leads</span>
      </div>
      <div class="user-area">
        <span id="userName"></span>
        <span class="role-badge" id="userRole"></span>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </header>

    <div class="content">
      <div class="page-header">
        <h1 class="page-title" id="mainTitle">Mes Leads</h1>
        <button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="liste" onclick="switchTab('liste')">📋 Liste</button>
        <button class="tab" data-tab="kanban" onclick="switchTab('kanban')">📊 Kanban</button>
      </div>

      <!-- Filters -->
      <div class="filters-bar" id="filtersBar"></div>

      <!-- Liste -->
      <div class="section active" id="tab-liste">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Prénom</th><th>Téléphone</th><th>CP</th><th>Budget</th><th>Délai</th><th>Gamme</th><th id="thMagasin" style="display:none">Magasin</th><th>Statut</th><th>Date</th><th>Actions</th></tr>
            </thead>
            <tbody id="leadsTable"></tbody>
          </table>
        </div>
        <div class="empty" id="leadsEmpty" style="display:none">Aucun lead pour le moment.</div>
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- Kanban -->
      <div class="section" id="tab-kanban">
        <div class="kanban" id="kanbanBoard">
          <div class="kanban-col" data-statut="nouveau" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="kanban-col-title">Nouveau <span class="count" id="count-nouveau">0</span></div>
            <div class="kanban-cards" id="col-nouveau"></div>
          </div>
          <div class="kanban-col" data-statut="contacte" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="kanban-col-title">Contacté <span class="count" id="count-contacte">0</span></div>
            <div class="kanban-cards" id="col-contacte"></div>
          </div>
          <div class="kanban-col" data-statut="rdv" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="kanban-col-title">RDV Planifié <span class="count" id="count-rdv">0</span></div>
            <div class="kanban-cards" id="col-rdv"></div>
          </div>
          <div class="kanban-col" data-statut="gagne" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="kanban-col-title">Gagné 🏆 <span class="count" id="count-gagne">0</span></div>
            <div class="kanban-cards" id="col-gagne"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="leadModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2 id="modalTitle">Détail du lead</h2>
      <div class="modal-grid" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    let currentUser = null;
    let allLeads = [];
    let filteredLeads = [];
    let currentFilter = 'all';
    let currentMagasin = 'all';
    let currentDateFrom = '';
    let currentDateTo = '';
    let currentPage = 1;
    const PAGE_SIZE = 25;
    const KANBAN_STATUTS = ['nouveau','contacte','rdv','gagne'];
    const STATUT_LABELS = { nouveau:'Nouveau', contacte:'Contacté', non_contacte:'Non contacté', archive:'Archivé', rdv:'RDV Planifié', gagne:'Gagné' };
    const NEXT_STATUT = { nouveau:'contacte', contacte:'rdv', rdv:'gagne' };
    const BUDGET_LABELS = { 'moins_5k':'< 5 000€', '5k_8k':'5-8 000€', '8k_15k':'8-15 000€', '15k_plus':'> 15 000€', 'moins_7k':'< 7 000€', '7k_15k':'7-15 000€', '8k_15k':'8-15 000€', '15k_25k':'15-25 000€', 'plus_25k':'> 25 000€' };
    const SOURCE_CONFIG = {
      'quiz':           { icon: '🎯', label: 'Quiz',          color: '#60a5fa' },
      'financement':    { icon: '💰', label: 'Financement',   color: '#34d399' },
      'comparateur':    { icon: '🔍', label: 'Comparateur',   color: '#a78bfa' },
      'fiche_produit':  { icon: '🛁', label: 'Fiche produit', color: '#c7a260' },
      'ma_selection':   { icon: '💝', label: 'Ma sélection',  color: '#f472b6' },
      'landing-magasin':{ icon: '📅', label: 'RDV magasin',   color: '#fb923c' },
    };
    const DELAI_LABELS = { urgent:'Urgent', '1_3_mois':'1-3 mois', '3_6_mois':'3-6 mois', 'juste_regarder':'Pas pressé' };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
    }
    function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    function timeAgo(d) { if (!d) return '-'; const diff = Math.floor((new Date() - new Date(d)) / 1000); if (diff < 60) return "à l'instant"; if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`; if (diff < 86400) return `il y a ${Math.floor(diff/3600)}h`; if (diff < 172800) return 'hier'; return `il y a ${Math.floor(diff/86400)}j`; }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    function applyFilters() {
      filteredLeads = allLeads.filter(l => {
        if (currentFilter !== 'all' && l.statut !== currentFilter) return false;
        if (currentMagasin !== 'all' && (l.magasin_nom || 'Non assigné') !== currentMagasin) return false;
        if (currentDateFrom && l.created_at && l.created_at.slice(0,10) < currentDateFrom) return false;
        if (currentDateTo && l.created_at && l.created_at.slice(0,10) > currentDateTo) return false;
        return true;
      });
      currentPage = 1;
    }

    function renderFilters() {
      const el = document.getElementById('filtersBar');
      const counts = { all: allLeads.length };
      ['nouveau','contacte','non_contacte','rdv','gagne','archive'].forEach(s => { counts[s] = allLeads.filter(l => l.statut === s).length; });

      let html = [
        { key:'all', label:'Tous' }, { key:'nouveau', label:'Nouveau' }, { key:'contacte', label:'Contacté' },
        { key:'non_contacte', label:'Non contacté' }, { key:'rdv', label:'RDV' }, { key:'gagne', label:'Gagné' }
      ].map(b => `<button class="filter-btn${currentFilter===b.key?' active':''}" onclick="setFilter('${b.key}')">${b.label} <span class="filter-count">${counts[b.key]||0}</span></button>`).join('');

      if (currentUser && currentUser.role === 'admin') {
        const magasins = [...new Set(allLeads.map(l => l.magasin_nom || 'Non assigné'))].sort();
        html += `<select class="filter-select" onchange="setMagasin(this.value)"><option value="all">Tous les magasins</option>`;
        magasins.forEach(m => { html += `<option value="${esc(m)}"${currentMagasin===m?' selected':''}>${esc(m)}</option>`; });
        html += `</select>`;
      }

      html += ` <input type="date" class="filter-input" value="${currentDateFrom}" onchange="setDateFrom(this.value)" title="Date début">`;
      html += ` <input type="date" class="filter-input" value="${currentDateTo}" onchange="setDateTo(this.value)" title="Date fin">`;
      el.innerHTML = html;
    }

    function setFilter(f) { currentFilter = f; applyFilters(); renderFilters(); renderTable(); }
    function setMagasin(m) { currentMagasin = m; applyFilters(); renderFilters(); renderTable(); }
    function setDateFrom(d) { currentDateFrom = d; applyFilters(); renderTable(); }
    function setDateTo(d) { currentDateTo = d; applyFilters(); renderTable(); }

    function renderTable() {
      const totalPages = Math.max(1, Math.ceil(filteredLeads.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * PAGE_SIZE;
      const shown = filteredLeads.slice(start, start + PAGE_SIZE);
      const isAdmin = currentUser && currentUser.role === 'admin';
      document.getElementById('leadsEmpty').style.display = shown.length ? 'none' : 'block';
      document.getElementById('leadsTable').innerHTML = shown.map(l => {
        const isNew = l.statut === 'nouveau';
        return `<tr>
          <td style="font-weight:600;color:#fff">${esc(l.prenom || '-')}</td>
          <td>${esc(l.telephone || '-')}</td><td>${esc(l.code_postal || '-')}</td>
          <td>${BUDGET_LABELS[l.budget] || esc(l.budget || '-')}</td>
          <td>${DELAI_LABELS[l.delai] || esc(l.delai || '-')}</td>
          <td>${esc(l.gamme_recommandee || '-')}</td>
          ${isAdmin ? `<td>${esc(l.magasin_nom || '-')}</td>` : ''}
          <td><span class="badge badge-${l.statut}">${STATUT_LABELS[l.statut] || l.statut}</span></td>
          <td style="white-space:nowrap">${formatDate(l.created_at)}</td>
          <td><div class="actions-cell">
            <button class="btn-view" onclick="openModal('${l.id}')">👁</button>
            ${isNew ? `<button class="btn-action" onclick="markContacte('${l.id}',this)">✓ Rappelé</button>` : ''}
          </div></td>
        </tr>`;
      }).join('');

      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }
      let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>←</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
          if (i === currentPage - 3 || i === currentPage + 3) html += `<span class="page-info">…</span>`;
          continue;
        }
        html += `<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>→</button>`;
      html += `<span class="page-info">${start+1}-${Math.min(start+PAGE_SIZE, filteredLeads.length)} sur ${filteredLeads.length}</span>`;
      pag.innerHTML = html;
    }

    function goPage(p) { const tp = Math.ceil(filteredLeads.length / PAGE_SIZE); if (p < 1 || p > tp) return; currentPage = p; renderTable(); }

    async function markContacte(id, btn) {
      if (btn) { btn.disabled = true; btn.textContent = '...'; }
      await updateLeadStatut(id, 'contacte');
      const lead = allLeads.find(l => l.id === id);
      if (lead) lead.statut = 'contacte';
      applyFilters(); renderAll(); showToast('✓ Lead marqué comme contacté');
    }

    function openModal(id) {
      const l = allLeads.find(x => x.id === id); if (!l) return;
      document.getElementById('modalTitle').textContent = `${l.prenom || 'Lead'} — Détail`;
      const fields = [['Prénom',l.prenom],['Téléphone',l.telephone],['Email',l.email],['Code postal',l.code_postal],['Ambiance',l.ambiance],['Objectif',l.objectif],['Nb personnes',l.nb_personnes],['Délai',DELAI_LABELS[l.delai]||l.delai],['Budget',BUDGET_LABELS[l.budget]||l.budget],['Type spa',l.type_spa],['Gamme recommandée',l.gamme_recommandee],['Modèles suggérés',l.modeles_suggeres],['Score intention',l.score_intention],['Magasin',l.magasin_nom],['Responsable',l.responsable],['Source',l.source],['Date',formatDate(l.created_at)]];
      document.getElementById('modalBody').innerHTML = fields.map(([label,val]) => `<div class="modal-field"><div class="field-label">${label}</div><div class="field-value">${esc(val||'-')}</div></div>`).join('');
      let actions = `<button class="modal-btn modal-btn-close" onclick="closeModal()">Fermer</button>`;
      if (l.statut === 'nouveau') actions += `<button class="modal-btn modal-btn-rappele" onclick="markContacte('${l.id}');closeModal()">✓ Marquer rappelé</button>`;
      document.getElementById('modalActions').innerHTML = actions;
      document.getElementById('leadModal').classList.add('open');
    }
    function closeModal() { document.getElementById('leadModal').classList.remove('open'); }

    function renderKanban() {
      const leadsForKanban = filteredLeads.length ? filteredLeads : allLeads;
      KANBAN_STATUTS.forEach(statut => {
        const col = document.getElementById('col-' + statut);
        const cards = leadsForKanban.filter(l => l.statut === statut);
        document.getElementById('count-' + statut).textContent = cards.length;
        const next = NEXT_STATUT[statut];
        col.innerHTML = cards.map(l => `
          <div class="kanban-card" draggable="true" data-id="${l.id}" data-statut="${l.statut}" ondragstart="onDragStart(event)" onclick="showModal(l)">
            ${(() => { const sc = SOURCE_CONFIG[l.source] || {icon:'📋',label:l.source||'Inconnu',color:'#9ca3af'}; return `<div class="card-source" style="background:${sc.color}22;color:${sc.color}">${sc.icon} ${sc.label}</div>`; })()}
            <div class="card-name">${esc(l.prenom || 'Inconnu')} · ${esc(l.code_postal || '-')}</div>
            ${currentUser && currentUser.role === 'admin' ? `<div class="card-info">${esc(l.magasin_nom || '-')}</div>` : ''}
            ${l.source === 'financement' && l.budget ? `<div class="card-info-row">💳 ${BUDGET_LABELS[l.budget] || l.budget}</div>` : ''}
            ${l.source === 'quiz' && l.budget ? `<div class="card-info-row">💶 ${BUDGET_LABELS[l.budget] || l.budget} · ${l.delai_label || l.delai || ''}</div>` : ''}
            ${l.source === 'comparateur' && l.modeles_suggeres ? `<div class="card-info-row">🔍 ${Array.isArray(l.modeles_suggeres) ? l.modeles_suggeres.join(', ') : l.modeles_suggeres}</div>` : ''}
            ${l.source === 'fiche_produit' && l.modeles_suggeres ? `<div class="card-info-row">🛁 ${Array.isArray(l.modeles_suggeres) ? l.modeles_suggeres[0] : l.modeles_suggeres}</div>` : ''}
            ${l.source === 'ma_selection' && l.modeles_suggeres ? `<div class="card-info-row">💝 ${Array.isArray(l.modeles_suggeres) ? l.modeles_suggeres.slice(0,2).join(', ') : l.modeles_suggeres}</div>` : ''}
            ${l.source === 'landing-magasin' ? `<div class="card-info-row">📅 ${l.magasin_nom || 'RDV showroom'}</div>` : ''}
            <div class="card-actions">
              <span class="card-date">${timeAgo(l.created_at)}</span>
              ${next ? `<button class="btn-advance" onclick="event.stopPropagation();advanceLead('${l.id}','${next}')">→ ${STATUT_LABELS[next]}</button>` : ''}
            </div>
          </div>
        `).join('');
      });
    }

    async function advanceLead(id, newStatut) {
      await updateLeadStatut(id, newStatut);
      const lead = allLeads.find(l => l.id === id);
      if (lead) lead.statut = newStatut;
      applyFilters(); renderAll(); showToast(`Lead déplacé → ${STATUT_LABELS[newStatut]}`);
    }

    let draggedId = null;
    function onDragStart(e) { draggedId = e.target.dataset.id; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('drag-over'); const ns = e.currentTarget.dataset.statut; if (draggedId && ns) advanceLead(draggedId, ns); draggedId = null; }
    document.addEventListener('dragend', () => { document.querySelectorAll('.drag-over,.dragging').forEach(el => el.classList.remove('drag-over','dragging')); });

    function exportCSV() {
      const isAdmin = currentUser && currentUser.role === 'admin';
      const headers = ['Prénom','Téléphone','Code Postal','Budget','Délai','Gamme','Statut','Date'];
      if (isAdmin) headers.splice(6, 0, 'Magasin');
      const rows = filteredLeads.map(l => {
        const row = [l.prenom||'',l.telephone||'',l.code_postal||'',BUDGET_LABELS[l.budget]||l.budget||'',DELAI_LABELS[l.delai]||l.delai||'',l.gamme_recommandee||'',STATUT_LABELS[l.statut]||l.statut,l.created_at?new Date(l.created_at).toLocaleDateString('fr-FR'):''];
        if (isAdmin) row.splice(6, 0, l.magasin_nom||'');
        return row;
      });
      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `leads_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      showToast('📥 Export CSV téléchargé');
    }

    function renderAll() { renderFilters(); renderTable(); renderKanban(); }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    (async () => {
      currentUser = await requireAuth(); if (!currentUser) return;
      if (currentUser.role === "admin") document.querySelectorAll(".admin-only").forEach(el => el.style.display = "");
      const isAdmin = currentUser.role === 'admin';
      document.getElementById('userName').innerHTML = `<strong>${esc(currentUser.nom)}</strong>`;
      document.getElementById('userRole').textContent = currentUser.role;
      document.getElementById('userRole').classList.add(currentUser.role);
      if (isAdmin) {
        document.getElementById('pageTitle').textContent = 'Tous les leads';
        document.getElementById('mainTitle').textContent = 'Tous les leads';
        document.getElementById('thMagasin').style.display = '';
      }
      allLeads = await fetchLeads(currentUser);
      filteredLeads = [...allLeads];
      renderAll();
    })();
  </script>
  <script>window._enableNotifToast = true;</script>
  <script src="notifications.js"></script>

</body>
</html>
