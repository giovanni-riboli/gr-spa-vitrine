<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Espace Revendeur — Giovanni Riboli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
</head>
<body>
  <div class="login-wrapper">
    <div class="logo">
      <img src="assets/logo-blanc.svg" alt="Giovanni Riboli" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="logo-text" style="display:none">GIOVANNI RIBOLI</div>
    </div>
    <div class="login-card">
      <h1>Espace Revendeur</h1>
      <p class="subtitle">Réservé aux revendeurs agréés Giovanni Riboli</p>
      <div class="error-msg" id="error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email professionnel</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>
        <button type="submit" class="btn-login" id="btnLogin">Se connecter</button>
      </form>
    </div>
    <div class="footer-links">
      <p><a href='/'>← Retour au site</a></p>
      <p>Vous n'avez pas encore accès ?<br>Contactez votre gestionnaire Giovanni Riboli.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="pro/auth.js"></script>
  <script>
    const sb = initSupabase();

    // If already logged in, redirect
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'pro/dashboard.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connexion...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const result = await login(email, password);
      if (result.success) {
        window.location.href = 'pro/dashboard.html';
      } else {
        errEl.textContent = 'Identifiants incorrects. Veuillez réessayer.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>

  <script src="selection.js"></script>
  <script src="offre-bar.js"></script>
</body>
</html>
