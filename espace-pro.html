<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Espace Revendeur — Giovanni Riboli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #1a2d3e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
    .logo { text-align: center; margin-bottom: 40px; }
    .logo img { height: 50px; filter: brightness(0) invert(1); }
    .logo-text { font-size: 22px; font-weight: 700; color: #c7a260; letter-spacing: 1px; }
    .login-card { background: #253a4c; border-radius: 12px; padding: 40px 36px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); border-top: 3px solid #c7a260; }
    .login-card h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .login-card .subtitle { font-size: 13px; color: #ccd8e0; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #ccd8e0; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #3a5268; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color .2s; background: #1a2d3e; color: #fff; }
    .form-group input:focus { outline: none; border-color: #c7a260; }
    .form-group input::placeholder { color: #6b8399; }
    .error-msg { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .btn-login { width: 100%; padding: 13px; background: #c7a260; color: #1a2d3e; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: background .2s; }
    .btn-login:hover { background: #d4b06e; }
    .btn-login:disabled { opacity: 0.6; cursor: wait; }
    .forgot { text-align: right; margin-bottom: 20px; }
    .forgot a { font-size: 12px; color: #c7a260; text-decoration: none; }
    .footer-links { text-align: center; margin-top: 24px; font-size: 13px; color: #6b8399; }
    .footer-links a { color: #c7a260; text-decoration: none; font-weight: 500; }
    .footer-links p { margin-bottom: 8px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #1a2d3e; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="logo">
      <img src="assets/logo-blanc.svg" alt="Giovanni Riboli" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="logo-text" style="display:none">GIOVANNI RIBOLI</div>
    </div>
    <div class="login-card">
      <h1>Espace Revendeur</h1>
      <p class="subtitle">Réservé aux revendeurs agréés Giovanni Riboli</p>
      <div class="error-msg" id="error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email professionnel</label>
          <input type="email" id="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>
        <button type="submit" class="btn-login" id="btnLogin">Se connecter</button>
      </form>
    </div>
    <div class="footer-links">
      <p><a href='/'>← Retour au site</a></p>
      <p>Vous n'avez pas encore accès ?<br>Contactez votre gestionnaire Giovanni Riboli.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="pro/auth.js"></script>
  <script>
    const sb = initSupabase();

    // If already logged in, redirect
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'pro/dashboard.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connexion...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const result = await login(email, password);
      if (result.success) {
        window.location.href = 'pro/dashboard.html';
      } else {
        errEl.textContent = 'Identifiants incorrects. Veuillez réessayer.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
