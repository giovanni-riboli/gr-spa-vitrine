        <div class="shop-info-right">
            <div id="shopMap" style="width:100%;height:360px;border-radius:4px;"></div>
    <script>
    function initShopMap_aquatech() {
        var geocoder = new google.maps.Geocoder();
        geocoder.geocode({address: "17 RUE VICTOR GRIGNARD 42000 ST ETIENNE, France"}, function(results, status) {
            if (status === 'OK') {
                var map = new google.maps.Map(document.getElementById('shopMap'), {
                    center: results[0].geometry.location, zoom: 14,
                    styles:[{featureType:'poi',elementType:'all',stylers:[{visibility:'off'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#e8f0f4'}]},{featureType:'landscape',elementType:'geometry',stylers:[{color:'#f8f6f2'}]}]
                });
                new google.maps.Marker({position:results[0].geometry.location,map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#c7a260',fillOpacity:1,strokeColor:'#ffffff',strokeWeight:2}});
            }
        });
    }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBIhhwEmidNOgH7GGmUSOXJlqq8aJ2cKeE&callback=initShopMap_aquatech"></script>
        </div>
