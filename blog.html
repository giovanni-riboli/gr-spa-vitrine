  <style>

    .blog-card--skeleton .blog-card__cat,
    .blog-card--skeleton .blog-card__title,
    .blog-card--skeleton .blog-card__date,
    .blog-card--skeleton .blog-card__excerpt { background:linear-gradient(90deg,#e8e4dd 25%,#d8d2c8 50%,#e8e4dd 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:3px; color:transparent; }
    .blog-card--skeleton .blog-card__link { display:none; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* Message vide */
    .blog-empty { text-align:center; padding:5rem 2rem; color:#888; font-family:'Inter',sans-serif; }
    .blog-empty p { font-size:1.05rem; }
  </style>
</head>
<body>

  <script>window.GR_NAV_TRANSPARENT = true;</script>

  <!-- HERO -->
  <section class="page-hero">

      <h1 style="color:#fff;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.5rem,5vw,4.5rem);line-height:1.1;margin:0;">Actualités &amp; Conseils</h1>

    </div>

  <!-- FILTRE CATÉGORIES -->
  <section style="background:#f8f6f2;padding:2.5rem 0 0;">

      <div id="category-filter" style="display:flex;flex-wrap:wrap;gap:.5rem;"></div>

  <!-- GRILLE ARTICLES -->
  <section style="padding:2.5rem 0 6rem;background:#f8f6f2;">
    <div class="container">
      <div id="blog-grid" class="blog-grid">
        <!-- Skeletons pendant le chargement -->
        <article class="blog-card blog-card--skeleton">
          <div class="blog-card__img"></div>
          <div class="blog-card__body">
            <span class="blog-card__cat">⬛⬛⬛</span>
            <h2 class="blog-card__title">⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛</h2>
            <p class="blog-card__date">⬛⬛⬛⬛⬛⬛</p>
            <p class="blog-card__excerpt">⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛</p>
            <a class="blog-card__link"></a>
          </div>
        </article>
        <article class="blog-card blog-card--skeleton">
          <div class="blog-card__img"></div>
          <div class="blog-card__body">
            <span class="blog-card__cat">⬛⬛⬛</span>
            <h2 class="blog-card__title">⬛⬛⬛⬛⬛⬛⬛⬛</h2>
            <p class="blog-card__date">⬛⬛⬛⬛⬛</p>
            <p class="blog-card__excerpt">⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛</p>
            <a class="blog-card__link"></a>
          </div>
        </article>
        <article class="blog-card blog-card--skeleton">
          <div class="blog-card__img"></div>
          <div class="blog-card__body">
            <span class="blog-card__cat">⬛⬛</span>
            <h2 class="blog-card__title">⬛⬛⬛⬛⬛⬛⬛⬛⬛</h2>
            <p class="blog-card__date">⬛⬛⬛⬛</p>
            <p class="blog-card__excerpt">⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛⬛</p>
            <a class="blog-card__link"></a>
          </div>
        </article>
      </div>

      <!-- Pagination -->
      <nav class="blog-pagination" aria-label="Pagination" id="blog-pagination" style="display:none;">
        <button id="prev-page" onclick="changePage(-1)" aria-label="Page précédente">‹</button>
        <span id="page-indicator">1</span>
        <button id="next-page" onclick="changePage(1)" aria-label="Page suivante">›</button>
      </nav>
    </div>
  </section>

  <!-- FOOTER -->
  <div id="gr-footer"></div>

  <script>
  (function() {
    var SUPABASE_URL = 'https://ohjzggceozamhdesecxi.supabase.co';
    var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanpnZ2Nlb3phbWhkZXNlY3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3Njc5MDYsImV4cCI6MjA5MjM0MzkwNn0.wW-tqXBDUtKURR31bh3CUWIcuYMUJTZLqq2LLT1kJnA';
    var PAGE_SIZE = 9;
    var currentPage = 1;
    var currentCat = null;
    var allArticles = [];

    function formatDate(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function buildCard(a) {
      var imgStyle = a.photo_url
        ? 'background-image:url(' + a.photo_url + ');background-size:cover;background-position:center;'
        : 'background:linear-gradient(135deg,#1a2d3d 0%,#253a4c 60%,#4a7a9b 100%);';

      return '<article class="blog-card">' +
        '<div class="blog-card__img" style="' + imgStyle + '"></div>' +
        '<div class="blog-card__body">' +
          '<span class="blog-card__cat">' + (a.categorie || '') + '</span>' +
          '<h2 class="blog-card__title">' + a.titre + '</h2>' +
          '<p class="blog-card__date">' + formatDate(a.date_publication) + '</p>' +
          '<p class="blog-card__excerpt">' + (a.extrait || '') + '</p>' +
          '<a href="/blog/' + a.slug + '" class="blog-card__link">Lire l\'article →</a>' +
        '</div>' +
        '</article>';
    }

    function buildCategories(articles) {
      var cats = {};
      articles.forEach(function(a) { if (a.categorie) cats[a.categorie] = true; });
      var cats = Object.keys(cats).sort();
      if (!cats.length) return;

      var container = document.getElementById('category-filter');
      var html = '<button class="cat-btn cat-btn--active" onclick="filterCat(null,this)">Tous</button>';
      cats.forEach(function(c) {
        html += '<button class="cat-btn" onclick="filterCat(\'' + c + '\',this)">' + c + '</button>';
      });
      container.innerHTML = html;
    }

    window.filterCat = function(cat, btn) {
      currentCat = cat;
      currentPage = 1;
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('cat-btn--active'); });
      if (btn) btn.classList.add('cat-btn--active');
      renderPage();
    };

    function renderPage() {
      var filtered = currentCat
        ? allArticles.filter(function(a) { return a.categorie === currentCat; })
        : allArticles;

      var total = filtered.length;
      var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * PAGE_SIZE;
      var page = filtered.slice(start, start + PAGE_SIZE);

      var grid = document.getElementById('blog-grid');
      if (!page.length) {
        grid.innerHTML = '<div class="blog-empty"><p>Aucun article dans cette catégorie.</p></div>';
      } else {
        grid.innerHTML = page.map(buildCard).join('');
      }

      // Pagination
      var nav = document.getElementById('blog-pagination');
      if (totalPages > 1) {
        nav.style.display = '';
        document.getElementById('page-indicator').textContent = currentPage + ' / ' + totalPages;
        document.getElementById('prev-page').disabled = currentPage === 1;
        document.getElementById('next-page').disabled = currentPage === totalPages;
      } else {
        nav.style.display = 'none';
      }
    }

    window.changePage = function(delta) {
      currentPage += delta;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    async function loadArticles() {
      try {
        var r = await fetch(
          SUPABASE_URL + '/rest/v1/articles?actif=eq.true&select=slug,titre,date_publication,extrait,photo_url,categorie&order=date_publication.desc',
          { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } }
        );
        var data = await r.json();
        if (!Array.isArray(data) || !data.length) {
          document.getElementById('blog-grid').innerHTML = '<div class="blog-empty"><p>Aucun article disponible pour le moment.</p></div>';
          return;
        }
        allArticles = data;
        buildCategories(data);
        renderPage();
      } catch(e) {
        console.error('Erreur chargement blog:', e);
        document.getElementById('blog-grid').innerHTML = '<div class="blog-empty"><p>Impossible de charger les articles. Réessayez plus tard.</p></div>';
      }
    }

    loadArticles();
  })();
  </script>

  <!-- Styles filtres catégories (inline pour ne pas modifier style.css) -->
  <style>

    cursor: pointer;
    transition: all .2s;

  .blog-pagination button:disabled { opacity: .35; cursor: default; }
  #page-indicator { font-size: .85rem; color: #555; }
  </style>
