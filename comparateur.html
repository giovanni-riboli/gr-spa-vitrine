<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur de Spas | Giovanni Riboli</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;color:#1a2d3e;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:0 20px}

/* Header */
.page-header{text-align:center;padding:50px 20px 30px}
.page-header h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;color:#1a2d3e;margin-bottom:8px}
.page-header p{color:#6b7280;font-size:1rem}

/* Filters */
.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px;padding:0 20px}
.filter-btn{padding:8px 20px;border-radius:50px;border:1.5px solid #d1d5db;background:#fff;color:#4b5563;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:#c7a260;color:#c7a260}
.filter-btn.active{background:#1a2d3e;color:#fff;border-color:#1a2d3e}

/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 20px 120px}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.cards-grid{grid-template-columns:1fr}}

.card{border:2px solid #e5e7eb;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;background:#fff}
.card:hover{border-color:#c7a260;box-shadow:0 2px 12px rgba(199,162,96,.15)}
.card.selected{border-color:#c7a260;background:#fffbf0;box-shadow:0 0 0 3px rgba(199,162,96,.2)}
.card-check{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.card.selected .card-check{background:#c7a260;border-color:#c7a260;color:#fff}
.card-name{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;margin-bottom:8px;padding-right:30px}
.badge{display:inline-block;padding:2px 10px;border-radius:50px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.badge-relax{background:#f3f4f6;color:#6b7280}
.badge-energy{background:#dbeafe;color:#3b82f6}
.badge-luxury{background:#fef3c7;color:#92750c}
.badge-nage{background:#d1fae5;color:#059669}
.card-specs{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:#6b7280}
.card-specs span{display:flex;align-items:center;gap:5px}

/* Sticky bar */
.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:#1a2d3e;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:16px;transform:translateY(100%);transition:transform .3s;z-index:100}
.sticky-bar.visible{transform:translateY(0)}
.sticky-bar span{font-size:.95rem}
.btn-compare{background:#c7a260;color:#fff;border:none;padding:10px 28px;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-compare:hover{background:#b08c4a}

/* Max toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#ef4444;color:#fff;padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:500;transition:transform .3s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Comparison view */
.comparison{display:none;padding:0 20px 60px}
.comparison.active{display:block}
.selection-view.hidden{display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid #d1d5db;padding:8px 18px;border-radius:8px;font-size:.9rem;color:#4b5563;cursor:pointer;margin-bottom:24px;transition:all .2s}
.back-btn:hover{border-color:#1a2d3e;color:#1a2d3e}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #e5e7eb}
table{width:100%;border-collapse:collapse;min-width:500px}
.section-header td{background:#1a2d3e;color:#fff;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;padding:12px 16px}
.model-header{background:#1a2d3e;color:#fff}
.model-header th{padding:14px 16px;font-size:.95rem;font-weight:600;text-align:center}
.model-header th:first-child{text-align:left}
tr.data-row td{padding:10px 16px;font-size:.88rem;border-bottom:1px solid #f0f0f0}
tr.data-row:nth-child(even) td{background:#f8f9fa}
tr.data-row td:first-child{font-weight:500;color:#374151;background:#f5f7fa;white-space:nowrap;position:sticky;left:0;z-index:1}
tr.data-row td:not(:first-child){text-align:center}

/* CTA row */
.cta-row td{padding:16px;text-align:center;border-top:2px solid #e5e7eb}
.cta-row a{display:inline-block;padding:8px 18px;border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none;margin:4px;transition:all .2s}
.btn-fiche{background:#1a2d3e;color:#fff}
.btn-fiche:hover{background:#2a4050}
.btn-devis{background:#c7a260;color:#fff}
.btn-devis:hover{background:#b08c4a}
</style>
</head>
<body>

<div class="toast" id="toast">Maximum 3 modèles</div>

<div class="selection-view" id="selectionView">
  <div class="page-header">
    <h1>Comparez nos spas</h1>
    <p>Choisissez 2 ou 3 modèles à comparer</p>
  </div>
  <div class="container">
    <div class="filters" id="filters"></div>
    <div class="cards-grid" id="grid"></div>
  </div>
  <div class="sticky-bar" id="stickyBar">
    <span id="stickyText">2 modèles sélectionnés</span>
    <button class="btn-compare" onclick="showComparison()">Comparer →</button>
  </div>
</div>

<div class="comparison container" id="comparisonView">
  <button class="back-btn" onclick="showSelection()">← Modifier la sélection</button>
  <div class="table-wrap">
    <table id="compTable"></table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ohjzggceozamhdesecxi.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oanpnZ2Nlb3phbWhkZXNlY3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3Njc5MDYsImV4cCI6MjA5MjM0MzkwNn0.wW-tqXBDUtKURR31bh3CUWIcuYMUJTZLqq2LLT1kJnA';

let produits = [];
let selected = new Set();
let currentFilter = 'tous';

function val(v, unit='', fallback='—') {
  if (v === null || v === undefined || v === '') return fallback;
  if (typeof v === 'boolean') return v ? '✅' : '❌';
  return v + (unit ? ' ' + unit : '');
}
function cascade(v) {
  if (!v || v === 0) return '❌';
  return `✅ ${v} cascade${v > 1 ? 's' : ''}`;
}
function badgeClass(gamme) {
  if (!gamme) return 'badge-relax';
  const g = gamme.toLowerCase();
  if (g.includes('energy')) return 'badge-energy';
  if (g.includes('luxury') || g.includes('luxe')) return 'badge-luxury';
  if (g.includes('nage')) return 'badge-nage';
  return 'badge-relax';
}

async function init() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/produits?actif=eq.true&select=*&order=gamme,nom`,
    { headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` } }
  );
  produits = await res.json();
  if (!Array.isArray(produits)) { console.error('Fetch error', produits); return; }

  // Build filters
  const gammes = [...new Set(produits.map(p => p.gamme).filter(Boolean))];
  const fDiv = document.getElementById('filters');
  fDiv.innerHTML = `<button class="filter-btn active" data-f="tous">Tous</button>` +
    gammes.map(g => `<button class="filter-btn" data-f="${g}">${g}</button>`).join('');
  fDiv.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => {
    fDiv.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.f;
    renderGrid();
  });

  renderGrid();
}

function renderGrid() {
  const filtered = currentFilter === 'tous' ? produits : produits.filter(p => p.gamme === currentFilter);
  const grid = document.getElementById('grid');
  grid.innerHTML = filtered.map(p => `
    <div class="card ${selected.has(p.slug) ? 'selected' : ''}" data-slug="${p.slug}" onclick="toggle('${p.slug}')">
      <div class="card-check">${selected.has(p.slug) ? '✓' : ''}</div>
      <div class="card-name">${p.nom}</div>
      <span class="badge ${badgeClass(p.gamme)}">${p.gamme || 'Spa'}</span>
      <div class="card-specs">
        <span>👥 ${val(p.nb_places)} places</span>
        <span>💨 ${val(p.nb_buses)} buses</span>
        <span>📐 ${val(p.longueur_cm)}×${val(p.largeur_cm)}×${val(p.hauteur_cm)} cm</span>
      </div>
    </div>
  `).join('');
  updateSticky();
}

function toggle(slug) {
  if (selected.has(slug)) { selected.delete(slug); }
  else {
    if (selected.size >= 3) {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
      return;
    }
    selected.add(slug);
  }
  renderGrid();
}

function updateSticky() {
  const bar = document.getElementById('stickyBar');
  const n = selected.size;
  bar.classList.toggle('visible', n >= 2);
  document.getElementById('stickyText').textContent = `${n} modèle${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}`;
}

function showComparison() {
  document.getElementById('selectionView').classList.add('hidden');
  const cv = document.getElementById('comparisonView');
  cv.classList.add('active');
  buildTable();
  window.scrollTo(0, 0);
}

function showSelection() {
  document.getElementById('selectionView').classList.remove('hidden');
  document.getElementById('comparisonView').classList.remove('active');
}

function buildTable() {
  const models = produits.filter(p => selected.has(p.slug));
  const t = document.getElementById('compTable');
  let h = '';

  // Header
  h += `<tr class="model-header"><th>Critère</th>${models.map(m => `<th>${m.nom}</th>`).join('')}</tr>`;

  function section(icon, title) {
    h += `<tr class="section-header"><td colspan="${models.length + 1}">${icon} ${title}</td></tr>`;
  }
  function row(label, fn) {
    h += `<tr class="data-row"><td>${label}</td>${models.map(m => `<td>${fn(m)}</td>`).join('')}</tr>`;
  }

  section('🏊', 'Caractéristiques générales');
  row('Gamme', m => `<span class="badge ${badgeClass(m.gamme)}">${m.gamme || '—'}</span>`);
  row('Places totales', m => val(m.nb_places));
  row('Places assises', m => val(m.nb_places_assises));
  row('Places allongées', m => val(m.nb_places_allongees));
  row('Dimensions', m => `${val(m.longueur_cm)} × ${val(m.largeur_cm)} × ${val(m.hauteur_cm)} cm`);
  row('Poids à vide', m => val(m.poids_kg, 'kg'));
  row('Poids plein', m => val(m.poids_plein_kg, 'kg'));
  row("Volume d'eau", m => val(m.volume_eau_l, 'L'));
  row('Puissance', m => val(m.puissance_kw, 'kW'));
  row('Alimentation', m => `${val(m.voltage)}V / ${val(m.amperage)}A`);

  section('💪', 'Massage & Hydromassage');
  row('Nombre de buses', m => val(m.nb_buses));
  row('Pompes massage', m => val(m.nb_pompes_massage));
  row('Pompe filtration', m => val(m.pompe_filtration_massage));
  row('Pompe air', m => val(m.pompe_air));
  row('Massage robotisé', m => val(m.massage_robotise));

  section('🌡️', 'Confort & Technologie');
  row('Chauffage', m => val(m.chauffage));
  row('Traitement UV', m => val(m.traitement_uv));
  row('Aromathérapie', m => val(m.aromatherapie));
  row('Système de contrôle', m => val(m.systeme_controle));
  row('Couverture', m => val(m.couverture));

  section('✨', 'Design & Finitions');
  row('Habillage', m => val(m.habillage));
  row('Couleur coque', m => val(m.couleur_coque));
  row('Revêtement intérieur', m => val(m.revetement_interieur));
  row('Structure', m => val(m.structure_aluminium));
  row('Isolation', m => val(m.isolation));
  row('Cascade RGB', m => cascade(m.cascade_rgb));
  row('LEDs RGB', m => val(m.leds_rgb));

  // Points forts
  section('🎯', 'Points forts');
  const hasPointsForts = models.some(m => m.points_forts);
  if (hasPointsForts) {
    row('Points forts', m => val(m.points_forts));
  } else {
    // Auto-calculated
    const maxBuses = Math.max(...models.map(m => m.nb_buses || 0));
    const maxPlaces = Math.max(...models.map(m => m.nb_places || 0));
    row('Points forts', m => {
      const pts = [];
      if ((m.nb_buses || 0) === maxBuses && maxBuses > 0) pts.push('Plus de buses');
      if ((m.nb_places || 0) === maxPlaces && maxPlaces > 0) pts.push('Plus de places');
      if (m.massage_robotise) pts.push('Massage robotisé');
      if (m.aromatherapie) pts.push('Aromathérapie');
      if (m.cascade_rgb > 0) pts.push('Cascade RGB');
      return pts.length ? pts.join(', ') : '—';
    });
  }

  // CTA
  h += `<tr class="cta-row"><td></td>${models.map(m => `<td>
    <a href="/produits/${m.slug}.html" class="btn-fiche">Voir la fiche</a>
    <a href="https://go.gr-spa.com/" class="btn-devis">Demander un devis</a>
  </td>`).join('')}</tr>`;

  t.innerHTML = h;
}

init();
</script>
</body>
</html>
